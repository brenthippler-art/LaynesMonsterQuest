<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Safety: the game may only load files from its own site, and may never talk to the network. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; frame-src 'none'; form-action 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0058F8" />
    <meta name="description" content="Explore a pixel world and find friendly monsters." />

    <!-- "Add to Home Screen": opens full-screen like an app. Icons are made locally by `npm run icons`. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Monster Quest" />
    <!-- Don't turn numbers into phone links, etc. -->
    <meta name="format-detection" content="telephone=no, date=no, email=no, address=no" />

    <title>Layne's Monster Quest</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
